spring.application.name=tyde

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tyde}
spring.datasource.username=${DB_USERNAME:tyde}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

tyde.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

tyde.resume.max-size-bytes=${TYDE_RESUME_MAX_SIZE_BYTES:10485760}
tyde.resume.storage-dir=${TYDE_RESUME_STORAGE_DIR:./var/resumes}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:12MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:15MB}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
